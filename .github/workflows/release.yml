name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.get_version.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: node scripts/bump-version.mjs --type=${{ github.event.inputs.bump_type }}

      - name: Get New Version
        id: get_version
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json public/version.json
          git commit -m "chore(release): $NEW_VERSION"
          git push origin main
          git tag v$NEW_VERSION
          git push origin v$NEW_VERSION

  release:
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust_targets: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    env:
      VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
      VITE_UNSPLASH_SECRET_KEY: ${{ secrets.VITE_UNSPLASH_SECRET_KEY }}
      VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Sync Version (if tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Match v1.0.0 or v.1.0.0
          if [[ $TAG_NAME =~ ^v\.?[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            # Remove 'v' or 'v.' prefix
            VERSION=${TAG_NAME#v}
            VERSION=${VERSION#.}
            echo "Syncing version to $VERSION"
            # Update package.json
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            # Update package-lock.json if present
            node -e "
              const fs = require('fs');
              if (!fs.existsSync('package-lock.json')) process.exit(0);
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = '$VERSION';
              if (lock.packages && lock.packages['']) lock.packages[''].version = '$VERSION';
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            "
            # Update tauri.conf.json
            node -e "
              const fs = require('fs');
              const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
              tauriConf.version = '$VERSION';
              fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');
            "
            # Update Cargo.toml
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/Cargo.toml';
              fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace(/^version = \".*\"$/m, 'version = \"$VERSION\"'));
            "
            # Update public/version.json for runtime check
            node -e "
              const fs = require('fs');
              const versionData = { version: '$VERSION' };
              fs.writeFileSync('public/version.json', JSON.stringify(versionData, null, 2) + '\n');
            "
          else
            echo "Tag $TAG_NAME does not start with 'v', skipping version sync."
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          VITE_UNSPLASH_SECRET_KEY: ${{ secrets.VITE_UNSPLASH_SECRET_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Package Windows portable
        if: matrix.platform == 'windows-latest' && matrix.args == ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = Join-Path $PWD "portable"
          $portableDir = Join-Path $portableRoot "Caltemp"
          $dataDir = Join-Path $portableDir "data"
          $exeSource = Join-Path $PWD "src-tauri\target\release\caltemp.exe"
          $exeTarget = Join-Path $portableDir "Caltemp.exe"
          $zipPath = Join-Path $PWD "Caltemp_${version}_windows_x64_portable.zip"

          if (!(Test-Path $exeSource)) {
            throw "Executable not found at $exeSource"
          }

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Copy-Item $exeSource $exeTarget -Force

          @(
            '@echo off',
            'set "CALTEMP_PORTABLE=1"',
            'start "" "%~dp0Caltemp.exe" --portable %*'
          ) | Set-Content -Encoding ASCII (Join-Path $portableDir "Caltemp-portable.cmd")

          @(
            'Caltemp portable',
            '=================',
            '',
            'Lancez Caltemp avec Caltemp-portable.cmd pour conserver les donnees dans ce dossier.',
            '',
            'Donnees locales :',
            '- data\events.json',
            '- data\settings.json',
            '',
            "Cette archive portable n'utilise pas l'installateur Windows et n'est pas ciblee par l'auto-update."
          ) | Set-Content -Encoding UTF8 (Join-Path $portableDir "README-portable.txt")

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zipPath -Force

          gh release upload $env:TAG_NAME $zipPath --clobber

  validate-updater-json:
    needs: [release, bump-version]
    if: always() && (needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate latest.json contains installable updater assets
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}
        with:
          script: |
            const tagName = process.env.TAG_NAME;
            const { owner, repo } = context.repo;

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
            const assets = release.data.assets;
            const assetNames = assets.map((asset) => asset.name);
            console.log(`Assets found for ${tagName}: ${assetNames.join(', ') || '(none)'}`);

            const latestJsonAsset = assets.find((asset) => asset.name === 'latest.json');
            if (!latestJsonAsset) {
              core.setFailed('latest.json was not uploaded. The app would not be able to check for updates.');
              return;
            }

            const download = await github.rest.repos.getReleaseAsset({
              owner,
              repo,
              asset_id: latestJsonAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const latestJson = JSON.parse(new TextDecoder().decode(download.data));
            const platforms = latestJson.platforms || {};
            console.log(`Updater platforms: ${Object.keys(platforms).join(', ') || '(none)'}`);

            const requiredPlatformGroups = [
              {
                label: 'Windows x64',
                keys: ['windows-x86_64-msi', 'windows-x86_64'],
                disallowedExtensions: ['.zip'],
              },
              {
                label: 'macOS Intel',
                keys: ['darwin-x86_64'],
              },
              {
                label: 'macOS Apple Silicon',
                keys: ['darwin-aarch64'],
              },
              {
                label: 'Linux x64',
                keys: ['linux-x86_64'],
              },
            ];

            for (const group of requiredPlatformGroups) {
              const key = group.keys.find((candidate) => platforms[candidate]?.url && platforms[candidate]?.signature);
              const entry = key ? platforms[key] : null;
              if (!entry) {
                core.setFailed(
                  `latest.json does not contain a signed ${group.label} updater entry. ` +
                    `Expected one of: ${group.keys.join(', ')} with url and signature. ` +
                    `Assets found: ${assetNames.join(', ') || '(none)'}`
                );
                return;
              }

              const disallowedExtension = group.disallowedExtensions?.find((extension) => entry.url.endsWith(extension));
              if (disallowedExtension) {
                core.setFailed(`${group.label} updater entry points to an unsupported ${disallowedExtension} asset: ${entry.url}`);
                return;
              }

              console.log(`${group.label} updater asset validated from ${key}: ${entry.url}`);
            }
